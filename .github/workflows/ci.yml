name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install basic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            biopython \
            numpy \
            pandas \
            PyYAML \
            pulp==2.7.0 \
            pytest \
            snakemake==7.32.4

      - name: Run unit tests
        run: make test

      - name: Check workflow environment declarations
        run: make check-env

      - name: Run workflow smoke test
        run: make smoke-test

      - name: Run external predictor mock tests
        run: make mock-test
